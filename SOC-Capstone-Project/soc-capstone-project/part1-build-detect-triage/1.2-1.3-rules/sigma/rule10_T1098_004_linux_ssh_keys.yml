title: Linux SSH Authorized Keys File Modification
id: 11111111-1111-4111-8111-111111111110
status: test
description: Detects Linux SSH Authorized Keys File Modification mapped to MITRE ATT&CK v19 (T1098.004).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_ssh_authorized_keys.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.persistence
    - attack.t1098.004
logsource:
    product: linux
    category: auditd
detection:
    selection:
        type: 'SYSCALL'
        key: 'ssh_keys'
    condition: selection
falsepositives:
    - Authorized administrators provisioning new SSH public keys
level: high
