title: Brute Force Failed Logons Followed by Successful Logon
id: 11111111-1111-4111-8111-111111111105
status: test
description: Detects Brute Force Failed Logons Followed by Successful Logon mapped to MITRE ATT&CK v19 (T1110).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_brute_force.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.credential_access
    - attack.t1110
logsource:
    product: windows
    category: security
detection:
    selection_failed:
        EventID: 4625
    selection_success:
        EventID: 4624
    condition: selection_failed or selection_success
falsepositives:
    - Users mistyping passwords multiple times before logging in
level: high
