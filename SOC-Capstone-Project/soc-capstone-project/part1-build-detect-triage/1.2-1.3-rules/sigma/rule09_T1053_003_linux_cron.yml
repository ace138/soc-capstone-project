title: Linux Cron Job Persistence Modification
id: 11111111-1111-4111-8111-111111111109
status: test
description: Detects Linux Cron Job Persistence Modification mapped to MITRE ATT&CK v19 (T1053.003).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_cron_modification.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.persistence
    - attack.t1053.003
logsource:
    product: linux
    category: auditd
detection:
    selection:
        type: 'SYSCALL'
        key: 'cron_persistence'
    condition: selection
falsepositives:
    - System administrators editing /etc/crontab for scheduled backups
level: medium
