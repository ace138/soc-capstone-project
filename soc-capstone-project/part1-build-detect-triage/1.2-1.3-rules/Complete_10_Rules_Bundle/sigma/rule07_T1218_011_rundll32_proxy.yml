title: Suspicious Rundll32 System Binary Proxy Execution
id: 11111111-1111-4111-8111-111111111107
status: test
description: Detects Suspicious Rundll32 System Binary Proxy Execution mapped to MITRE ATT&CK v19 (T1218.011).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_rundll32_susp_activity.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_cli:
        CommandLine|contains:
            - 'javascript:'
            - 'RunHTMLApplication'
            - 'comsvcs'
            - '\AppData\'
            - '\Windows\Temp\'
    condition: selection_img and selection_cli
falsepositives:
    - Uncommon legacy installers invoking DLLs from temporary paths
level: high
