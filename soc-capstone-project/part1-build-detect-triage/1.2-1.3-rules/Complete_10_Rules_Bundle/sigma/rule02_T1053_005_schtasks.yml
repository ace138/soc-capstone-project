title: Scheduled Task Creation via Schtasks
id: 11111111-1111-4111-8111-111111111102
status: test
description: Detects Scheduled Task Creation via Schtasks mapped to MITRE ATT&CK v19 (T1053.005).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Software installers and system administrators creating scheduled maintenance tasks
level: medium
