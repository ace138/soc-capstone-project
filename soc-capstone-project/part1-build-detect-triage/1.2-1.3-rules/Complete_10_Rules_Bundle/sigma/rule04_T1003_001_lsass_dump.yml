title: LSASS Memory Credential Dumping Activity
id: 11111111-1111-4111-8111-111111111104
status: test
description: Detects LSASS Memory Credential Dumping Activity mapped to MITRE ATT&CK v19 (T1003.001).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    product: windows
    category: process_access
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1fffff'
            - '0x143a'
            - '0x1410'
            - '0x1010'
    condition: selection
falsepositives:
    - Antivirus or EDR agents scanning LSASS memory
level: critical
