title: New Windows Service Created via Sc.exe or Event 7045
id: 11111111-1111-4111-8111-111111111103
status: test
description: Detects New Windows Service Created via Sc.exe or Event 7045 mapped to MITRE ATT&CK v19 (T1543.003).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sc_create_service.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains: 'create'
    condition: selection
falsepositives:
    - Legitimate driver or software installation
level: medium
