title: Suspicious PowerShell Encoded or Download Cradle Execution
id: 11111111-1111-4111-8111-111111111101
status: stable
description: >
    Detects behavioral indicators of malicious PowerShell execution (encoded commands,
    in-memory Invoke-Expression cradles, or web download methods) rather than static file
    names or hashes. Tuned to exclude benign NT AUTHORITY\SYSTEM forwarder helper scripts.
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd.yml
    - https://attack.mitre.org/techniques/T1059/001/
author: Member 1 (Detection Lead) - Adapted from Florian Roth (SigmaHQ)
date: 2026/10/18
modified: 2026/10/19
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'
            - 'FromBase64String'
            - 'IEX'
            - 'Invoke-Expression'
            - 'DownloadString'
            - 'DownloadFile'
    filter_system_splunk:
        User|contains: 'SYSTEM'
        ParentImage|endswith: '\splunkd.exe'
    condition: selection_img and selection_cli and not filter_system_splunk
falsepositives:
    - Authorized administrative provisioning scripts using Base64 parameters
level: high
