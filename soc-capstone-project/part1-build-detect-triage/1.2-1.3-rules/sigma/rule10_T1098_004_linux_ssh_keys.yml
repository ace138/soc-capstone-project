title: Linux SSH Authorized Keys File Modification via Auditd
id: 11111111-1111-4111-8111-111111111110
status: stable
description: >
    Detects behavioral modifications to SSH authorized_keys files on Linux servers via auditd
    syscall telemetry (key=ssh_keys) indicating unauthorized persistent remote access.
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_ssh_authorized_keys.yml
    - https://attack.mitre.org/techniques/T1098/004/
author: Member 3 (Linux & Forensics Lead) - Adapted from Pawel Mazur (SigmaHQ)
date: 2026/10/18
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1098.004
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type:
            - 'SYSCALL'
            - 'EXECVE'
            - 'PATH'
        key: 'ssh_keys'
    condition: selection
falsepositives:
    - Authorized DevOps or IAM key rotation workflows
level: high
