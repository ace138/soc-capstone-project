title: Ingress Tool Transfer via Certutil URLCache or CLI Web Utilities
id: 11111111-1111-4111-8111-111111111108
status: stable
description: >
    Detects behavioral Living-off-the-Land ingress tool transfer where certutil.exe, curl.exe,
    or PowerShell Invoke-WebRequest fetches payloads from remote HTTP/HTTPS endpoints.
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_download.yml
    - https://attack.mitre.org/techniques/T1105/
author: Member 4 (Threat Intel & Readiness Lead) - Adapted from Florian Roth (SigmaHQ)
date: 2026/10/18
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    product: windows
    category: process_creation
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'
            - '-split'
            - '-verifyctl'
    selection_webcli:
        Image|endswith:
            - '\curl.exe'
            - '\powershell.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'Invoke-WebRequest'
            - 'wget '
    condition: selection_certutil or selection_webcli
falsepositives:
    - Authorized software engineers downloading internal artifacts via curl
level: medium
