title: Brute Force Failed Logons Followed by Successful Logon (Correlation Rule)
id: 11111111-1111-4111-8111-111111111105
status: stable
description: >
    Correlation rule detecting 3 or more failed Windows authentication attempts (EventID 4625)
    followed by at least 1 successful authentication (EventID 4624) for the same account and
    host within a 10-minute window.
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_brute_force.yml
    - https://attack.mitre.org/techniques/T1110/
author: Member 2 (SIEM Architect) - Custom Temporal Correlation Rule based on SigmaHQ
date: 2026/10/18
tags:
    - attack.credential_access
    - attack.t1110
logsource:
    product: windows
    service: security
detection:
    selection_failed:
        EventID: 4625
    selection_success:
        EventID: 4624
    condition: selection_failed or selection_success
correlation:
    type: temporal_ordered
    rules:
        - selection_failed
        - selection_success
    group-by:
        - TargetUserName
        - Computer
    timespan: 10m
    condition:
        gte: 3
falsepositives:
    - Legitimate user mistyping password 3+ times immediately after password rotation
level: high
