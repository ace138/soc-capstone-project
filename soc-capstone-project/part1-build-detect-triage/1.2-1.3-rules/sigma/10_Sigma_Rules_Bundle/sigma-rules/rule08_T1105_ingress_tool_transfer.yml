title: Ingress Tool Transfer via Certutil or Curl
id: 11111111-1111-4111-8111-111111111108
status: test
description: Detects Ingress Tool Transfer via Certutil or Curl mapped to MITRE ATT&CK v19 (T1105).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_download.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    product: windows
    category: process_creation
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'
            - '-split'
    selection_curl:
        Image|endswith: '\curl.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: selection_certutil or selection_curl
falsepositives:
    - Developers or administrators downloading packages via curl
level: medium
