title: Suspicious PowerShell Encoded or Download Execution
id: 11111111-1111-4111-8111-111111111101
status: test
description: Detects Suspicious PowerShell Encoded or Download Execution mapped to MITRE ATT&CK v19 (T1059.001).
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd.yml
author: SOC Capstone Student
date: 2026-10-18
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'
            - 'FromBase64String'
            - 'IEX'
            - 'DownloadString'
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate administrative scripts using encoded parameters
level: high
