title: Linux Cron Job Persistence Modification via Auditd
id: 11111111-1111-4111-8111-111111111109
status: stable
description: >
    Detects behavioral write/attribute modifications to Linux cron scheduling files
    (/etc/crontab, /etc/cron.d, /var/spool/cron/crontabs) monitored by auditd syscall rules.
references:
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_cron_modification.yml
    - https://attack.mitre.org/techniques/T1053/003/
author: Member 3 (Linux & Forensics Lead) - Adapted from Ömer Günal (SigmaHQ)
date: 2026/10/18
tags:
    - attack.persistence
    - attack.execution
    - attack.privilege_escalation
    - attack.t1053.003
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type:
            - 'SYSCALL'
            - 'EXECVE'
            - 'PATH'
        key: 'cron_persistence'
    condition: selection
falsepositives:
    - Authorized Linux system administrators updating scheduled backup jobs
level: medium
